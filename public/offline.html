<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Sin conexión - STC Control</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; padding-top: max(24px, env(safe-area-inset-top));
      background: #000; color: #f0f0f0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 340px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 {
      margin-top: 22px; font-size: 26px; font-weight: 800;
      letter-spacing: .02em; text-transform: uppercase;
    }
    p { margin-top: 10px; font-size: 15px; line-height: 1.55; color: #8f8f8f; }
    button {
      margin-top: 26px; width: 100%; height: 48px; border: 0; border-radius: 12px;
      background: #ea9d13; color: #120c00; font: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(.98); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="STC">
    <h1>Sin conexión</h1>
    <p>No se pudo cargar STC Control. Comprueba tu conexión a internet e inténtalo de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
  <script>
    // Vuelve sola en cuanto hay red.
    window.addEventListener('online', () => location.reload())
  </script>
</body>
</html>
